@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.lp-hero{--mx:0;--my:0}

.lp-glow::after{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));transform:translateX(-150%) skewX(-18deg);pointer-events:none}
.lp-glow:hover::after{transform:translateX(280%) skewX(-18deg);transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.lp-tilt{position:relative}
.lp-tilt::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--gx) 38%,rgba(53,148,214,.17),rgba(53,148,214,0) 70%);opacity:0;transition:opacity .3s}
.lp-tilt:hover::before,.lp-tilt:focus-visible::before{opacity:1}

.lp-tp{display:none}

@keyframes lp-word{from{transform:translateY(112%)}to{transform:none}}

.lp .lp-tilt:has(.tz-l:hover){transform:perspective(900px) translateY(-6px) rotateY(-5deg) rotateX(1.5deg);--gx:14%}
.lp .lp-tilt:has(.tz-c:hover){transform:perspective(900px) translateY(-6px) rotateX(-1deg);--gx:50%}

}
@supports (animation-timeline:view()){
@media (prefers-reduced-motion:no-preference){

}}
